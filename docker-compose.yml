version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: consultor-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consultor_excel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - consultor-network

  redis:
    image: redis:7-alpine
    container_name: consultor-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - consultor-network

volumes:
  postgres_data:

networks:
  consultor-network:
    driver: bridge
