<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="100%">
  <rect width="1100" height="400" rx="16" fill="#0F172A"/>
  <text x="550" y="36" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">MODELO RELACIONAL MULTI-EMPRESA — POSTGRESQL 15 (consultor_excel_db)</text>
  <rect x="40" y="68" width="210" height="115" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="68" width="210" height="26" rx="8" fill="#0284C7"/>
  <text x="145" y="86" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">tenants</text>
  <text x="52" y="112" fill="#FDE047" font-family="monospace" font-size="11">PK id : SERIAL</text>
  <text x="52" y="131" fill="#E2E8F0" font-family="monospace" font-size="11">   name : VARCHAR(255)</text>
  <text x="52" y="150" fill="#E2E8F0" font-family="monospace" font-size="11">   nit : VARCHAR(50)</text>
  <rect x="40" y="215" width="210" height="145" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
  <rect x="40" y="215" width="210" height="26" rx="8" fill="#4F46E5"/>
  <text x="145" y="233" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">users</text>
  <text x="52" y="259" fill="#FDE047" font-family="monospace" font-size="11">PK id : SERIAL</text>
  <text x="52" y="278" fill="#38BDF8" font-family="monospace" font-size="11">FK tenant_id : INT</text>
  <text x="52" y="297" fill="#E2E8F0" font-family="monospace" font-size="11">   username / email</text>
  <text x="52" y="316" fill="#E2E8F0" font-family="monospace" font-size="11">   role : admin|consultor</text>
  <text x="52" y="335" fill="#94A3B8" font-family="monospace" font-size="11">   password_hash : TEXT</text>
  <rect x="315" y="68" width="265" height="292" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.8"/>
  <rect x="315" y="68" width="265" height="26" rx="8" fill="#059669"/>
  <text x="447" y="86" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">clients (Empresas NIIF)</text>
  <text x="327" y="112" fill="#FDE047" font-family="monospace" font-size="11">PK id : SERIAL</text>
  <text x="327" y="131" fill="#38BDF8" font-family="monospace" font-size="11">FK tenant_id : INT</text>
  <text x="327" y="150" fill="#E2E8F0" font-family="monospace" font-size="11">   name, nit, city, address</text>
  <text x="327" y="169" fill="#E2E8F0" font-family="monospace" font-size="11">   incorporation_info : TEXT</text>
  <text x="327" y="188" fill="#E2E8F0" font-family="monospace" font-size="11">   corporate_purpose : TEXT</text>
  <text x="327" y="212" fill="#6EE7B7" font-family="monospace" font-size="11">   legal_representative</text>
  <text x="327" y="231" fill="#6EE7B7" font-family="monospace" font-size="11">   accountant_name + tp</text>
  <text x="327" y="250" fill="#6EE7B7" font-family="monospace" font-size="11">   auditor_name + tp</text>
  <text x="327" y="274" fill="#93C5FD" font-family="monospace" font-size="11">   consortium_name : VARCHAR</text>
  <text x="327" y="293" fill="#93C5FD" font-family="monospace" font-size="11">   consortium_share : NUMERIC</text>
  <rect x="645" y="68" width="205" height="140" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="645" y="68" width="205" height="26" rx="8" fill="#D97706"/>
  <text x="747" y="86" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">imported_files</text>
  <text x="657" y="112" fill="#FDE047" font-family="monospace" font-size="11">PK id : SERIAL</text>
  <text x="657" y="131" fill="#38BDF8" font-family="monospace" font-size="11">FK client_id : INT</text>
  <text x="657" y="150" fill="#E2E8F0" font-family="monospace" font-size="11">   file_name / period_year</text>
  <text x="657" y="169" fill="#FCD34D" font-family="monospace" font-size="11">   source_role : VARCHAR</text>
  <rect x="645" y="230" width="205" height="130" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
  <rect x="645" y="230" width="205" height="26" rx="8" fill="#7E22CE"/>
  <text x="747" y="248" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">accounts (PUC)</text>
  <text x="657" y="274" fill="#FDE047" font-family="monospace" font-size="11">PK id : SERIAL</text>
  <text x="657" y="293" fill="#38BDF8" font-family="monospace" font-size="11">FK client_id : INT</text>
  <text x="657" y="312" fill="#E2E8F0" font-family="monospace" font-size="11">UK account_code : VARCHAR</text>
  <text x="657" y="331" fill="#D8B4FE" font-family="monospace" font-size="11">   account_type : VARCHAR(60)</text>
  <rect x="885" y="68" width="185" height="292" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
  <rect x="885" y="68" width="185" height="26" rx="8" fill="#BE185D"/>
  <text x="977" y="86" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">accounting_balances</text>
  <text x="895" y="112" fill="#FDE047" font-family="monospace" font-size="11">PK id : SERIAL</text>
  <text x="895" y="131" fill="#38BDF8" font-family="monospace" font-size="11">FK client_id / file_id</text>
  <text x="895" y="150" fill="#E2E8F0" font-family="monospace" font-size="11">   account_code</text>
  <text x="895" y="169" fill="#E2E8F0" font-family="monospace" font-size="11">   period_date : DATE</text>
  <text x="895" y="188" fill="#F9A8D4" font-family="monospace" font-size="11">   source_role</text>
  <text x="895" y="212" fill="#E2E8F0" font-family="monospace" font-size="11">   opening / debits / cred</text>
  <text x="895" y="231" fill="#34D399" font-family="monospace" font-size="11">   closing_balance</text>
  <text x="895" y="260" fill="#FDE047" font-family="monospace" font-size="11">   third_party_nit</text>
  <text x="895" y="279" fill="#FDE047" font-family="monospace" font-size="11">   third_party_name</text>
  <line x1="250" y1="125" x2="315" y2="125" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="145" y1="183" x2="145" y2="215" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="580" y1="135" x2="645" y2="135" stroke="#34D399" stroke-width="1.5"/>
  <line x1="580" y1="295" x2="645" y2="295" stroke="#34D399" stroke-width="1.5"/>
  <line x1="850" y1="140" x2="885" y2="140" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="850" y1="295" x2="885" y2="295" stroke="#A855F7" stroke-width="1.5"/>
</svg>